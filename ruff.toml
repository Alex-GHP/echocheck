target-version = "py314"
line-length = 100

extend-exclude = [
    "data",
    "processed_data",
    "processed_data_jsonl",
    "models",
    "wandb",
    "evaluation_results.json",
]

[lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "C4",
    "N",
    "PTH",
    "RUF",
]

ignore = [
    "E501",
    "N812",
    "B008",
    "SIM108",
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]

[lint.isort]
known-first-party = ["echocheck"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
