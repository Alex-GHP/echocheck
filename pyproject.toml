[project]
name = "echocheck"
version = "0.1.0"
description = "Political Ideology and Stance Classification using Advanced NLP techniques"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "accelerate>=0.26.0",
    "datasets>=4.5.0",
    "evaluate>=0.4.6",
    "huggingface-hub>=0.36.0",
    "numpy>=2.4.1",
    "pandas>=3.0.0",
    "pydantic-settings>=2.14.0",
    "scikit-learn>=1.8.0",
    "tensorboard>=2.20.0",
    "torch>=2.10.0",
    "tqdm>=4.67.1",
    "transformers>=4.57.6",
    "wandb>=0.26.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.14",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"echocheck" = "src"}
packages = ["echocheck", "echocheck.data", "echocheck.models"]
